name: Feature Request
description: Suggest a preset, layout tweak, or CLI option
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What would you like to add or change?
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: Reference (optional)
      description: Link to Material 3 specs or screenshots if relevant.
